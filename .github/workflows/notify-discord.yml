name: Notify Discord on Push

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit message to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_HASH: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}

        run: |
          TIMESTAMP=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          DAY=$(TZ='Asia/Kolkata' date '+%A')

          COMMIT_URL_PREFIX="https://github.com/${REPO_NAME}/commit"

          COMMITS_LIST=$(printf '%s' "$COMMITS_JSON" | jq -r \
            --arg url "$COMMIT_URL_PREFIX" \
            '
              (. // [])
              | reverse
              | .[]
              | "- [" + .id[0:7] + "](" + $url + "/" + .id + ") " +
                (.message | split("\n")[0])
            ' 2>/dev/null || true)

          if [ -z "$COMMITS_LIST" ]; then
            SHORT_HASH="${COMMIT_HASH:0:7}"
            COMMIT_URL="${COMMIT_URL_PREFIX}/${COMMIT_HASH}"
            COMMITS_LIST="- [${SHORT_HASH}](${COMMIT_URL}) ${COMMIT_MSG}"
          fi

          jq -n \
            --arg repo "$REPO_NAME" \
            --arg author "$AUTHOR" \
            --arg day "$DAY" \
            --arg timestamp "$TIMESTAMP" \
            --arg branch "$BRANCH" \
            --arg commits "$COMMITS_LIST" \
            '{
              content:
                ("*Repo:* " + $repo + "\n" +
                 "*By:* " + $author + "\n" +
                 "*Day:* " + $day + "\n" +
                 "*Time:* " + $timestamp + "\n" +
                 "*From:* " + $branch + "\n" +
                 "*Commits:*\n" + $commits)
            }
            | .content |= (
                if length > 2000
                then .[0:1990] + "\n…"
                else .
                end
            )' > payload.json

          curl -fsS \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "$DISCORD_WEBHOOK"
